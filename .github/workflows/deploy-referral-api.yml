name: Deploy EasyFile Referral API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "referral-api/**"
      - ".github/workflows/deploy-referral-api.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
      AZURE_FUNCTIONAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment configuration
        shell: bash
        run: |
          test -n "$AZURE_FUNCTIONAPP_NAME" || (echo "Set repository variable AZURE_FUNCTIONAPP_NAME" && exit 1)
          test -n "$AZURE_FUNCTIONAPP_PUBLISH_PROFILE" || (echo "Set repository secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: referral-api/package.json

      - name: Install production dependencies
        working-directory: referral-api
        run: npm install --omit=dev

      - name: Validate referral API
        working-directory: referral-api
        run: npm run check

      - name: Deploy Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: referral-api
          publish-profile: ${{ env.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
