deploy-referral-api.yml
name: Deploy EasyFile Referral API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "referral-api/**"
      - "infra/referral-edge/**"
      - "assets/js/easyfile-referral-config.js"
      - ".github/workflows/deploy-referral-api.yml"
  pull_request:
    paths:
      - "referral-api/**"
      - "infra/referral-edge/**"
      - "assets/js/easyfile-referral-config.js"
      - ".github/workflows/deploy-referral-api.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        working-directory: referral-api
        run: npm install --omit=dev --no-audit --no-fund

      - name: Validate and test referral API
        working-directory: referral-api
        run: npm run check

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      EASYFILE_REFERRAL_HEALTH_URL: ${{ vars.EASYFILE_REFERRAL_HEALTH_URL }}
      AZURE_APIM_NAME: ${{ vars.AZURE_APIM_NAME }}
      AZURE_APIM_API_ID: ${{ vars.AZURE_APIM_API_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          missing=0
          for name in AZURE_FUNCTIONAPP_NAME AZURE_RESOURCE_GROUP AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID EASYFILE_REFERRAL_HEALTH_URL AZURE_APIM_NAME AZURE_APIM_API_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing repository variable: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        working-directory: referral-api
        run: npm install --omit=dev --no-audit --no-fund

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required Function App security settings
        shell: bash
        run: |
          az functionapp config appsettings list \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" > "$RUNNER_TEMP/easyfile-app-settings.json"
          node - "$RUNNER_TEMP/easyfile-app-settings.json" <<'NODE'
          const fs = require("fs");
          const settings = Object.fromEntries(JSON.parse(fs.readFileSync(process.argv[2], "utf8")).map(({ name, value }) => [name, String(value || "")]));
          const required = ["EASYFILE_EMAIL_HMAC_SECRET", "EASYFILE_EMAIL_CONNECTION_STRING", "EASYFILE_EMAIL_SENDER", "EASYFILE_EDGE_SHARED_SECRET"];
          const missing = required.filter((name) => !settings[name]);
          if (settings.EASYFILE_EMAIL_HMAC_SECRET?.length < 32) missing.push("EASYFILE_EMAIL_HMAC_SECRET (minimum 32 characters)");
          if (settings.EASYFILE_EDGE_SHARED_SECRET?.length < 32) missing.push("EASYFILE_EDGE_SHARED_SECRET (minimum 32 characters)");
          if (settings.EASYFILE_REQUIRE_EMAIL_VERIFICATION?.toLowerCase() !== "true") missing.push("EASYFILE_REQUIRE_EMAIL_VERIFICATION=true");
          if (settings.EASYFILE_REQUIRE_EDGE_GATEWAY?.toLowerCase() !== "true") missing.push("EASYFILE_REQUIRE_EDGE_GATEWAY=true");
          if (!settings.EASYFILE_REFERRALS_STORAGE && !settings.AzureWebJobsStorage) missing.push("EASYFILE_REFERRALS_STORAGE or AzureWebJobsStorage");
          if (!settings.EASYFILE_ALLOWED_ORIGINS || settings.EASYFILE_ALLOWED_ORIGINS.includes("*")) missing.push("EASYFILE_ALLOWED_ORIGINS (exact origins only)");
          if (missing.length) throw new Error(`Missing or unsafe Function App setting(s): ${missing.join(", ")}`);
          NODE

      - name: Apply APIM referral edge policy
        shell: bash
        run: |
          az apim api policy create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --service-name "$AZURE_APIM_NAME" \
            --api-id "$AZURE_APIM_API_ID" \
            --policy-format xml \
            --value-path "infra/referral-edge/apim-referral-policy.xml"

      - name: Deploy Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: referral-api

      - name: Run deployed referral acceptance tests
        shell: bash
        run: |
          for attempt in {1..12}; do
            if EASYFILE_REFERRAL_HEALTH_URL="$EASYFILE_REFERRAL_HEALTH_URL" node referral-api/test/deployed-acceptance.mjs; then
              exit 0
            fi
            echo "Deployment acceptance attempt $attempt did not pass yet."
            sleep 10
          done
          echo "Referral API deployment acceptance did not pass."
          exit 1

