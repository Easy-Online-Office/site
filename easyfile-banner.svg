<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">EasyFile — Simple. Fast. Professional.</title>
  <desc id="desc">EasyFile banner showing business document modules and a dashboard preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a4d"/>
      <stop offset="0.5" stop-color="#0b3ba8"/>
      <stop offset="0.72" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#edf6ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2f78"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#020c2d" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020c2d" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>
  <circle cx="1430" cy="90" r="270" fill="#fff" opacity="0.17"/>
  <circle cx="1510" cy="410" r="250" fill="#fff" opacity="0.55"/>
  <circle cx="-80" cy="650" r="330" fill="#38bdf8" opacity="0.12"/>

  <g transform="translate(80 80)" filter="url(#shadow)">
    <rect width="150" height="150" rx="34" fill="#fff"/>
    <rect x="24" y="24" width="102" height="102" rx="24" fill="#2563eb"/>
    <path d="M52 48h43l18 18v51H52z" fill="#fff" opacity="0.98"/>
    <path d="M95 48v20h18" fill="none" stroke="#2563eb" stroke-width="7" stroke-linejoin="round"/>
    <path d="M68 82h29M68 96h29" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
  </g>

  <text x="260" y="164" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="-5">EasyFile</text>
  <text x="263" y="220" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Simple. <tspan fill="#38bdf8">Fast.</tspan> Professional.</text>
  <rect x="263" y="248" width="560" height="3" rx="2" fill="#38bdf8"/>
  <text x="263" y="300" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Quotes, invoices, orders, receipts and more.</text>
  <text x="263" y="336" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="21">Practical business tools in one responsive workspace.</text>

  <g transform="translate(80 390)" font-family="Inter, Arial, sans-serif" text-anchor="middle" filter="url(#soft)">
    <g transform="translate(0 0)"><rect width="125" height="105" rx="20" fill="#fff"/><circle cx="62.5" cy="37" r="18" fill="#dbeafe"/><path d="M55 27h16v20H55z" fill="#2563eb"/><text x="62.5" y="81" fill="#0f172a" font-size="15" font-weight="800">Quotes</text></g>
    <g transform="translate(140 0)"><rect width="125" height="105" rx="20" fill="#fff"/><circle cx="62.5" cy="37" r="18" fill="#dcfce7"/><path d="M55 27h16v20H55z" fill="#16a34a"/><text x="62.5" y="81" fill="#0f172a" font-size="15" font-weight="800">Invoices</text></g>
    <g transform="translate(280 0)"><rect width="125" height="105" rx="20" fill="#fff"/><circle cx="62.5" cy="37" r="18" fill="#ede9fe"/><path d="M52 31h21l-3 15H55z" fill="#7c3aed"/><text x="62.5" y="76" fill="#0f172a" font-size="13" font-weight="800">Purchase</text><text x="62.5" y="92" fill="#0f172a" font-size="13" font-weight="800">Orders</text></g>
    <g transform="translate(420 0)"><rect width="125" height="105" rx="20" fill="#fff"/><circle cx="62.5" cy="37" r="18" fill="#fef3c7"/><path d="M52 31h21l-3 15H55z" fill="#f59e0b"/><text x="62.5" y="76" fill="#0f172a" font-size="13" font-weight="800">Sales</text><text x="62.5" y="92" fill="#0f172a" font-size="13" font-weight="800">Orders</text></g>
    <g transform="translate(560 0)"><rect width="125" height="105" rx="20" fill="#fff"/><circle cx="62.5" cy="37" r="18" fill="#fee2e2"/><path d="M54 26h17v23l-4-3-4 3-4-3-5 3z" fill="#ef4444"/><text x="62.5" y="81" fill="#0f172a" font-size="15" font-weight="800">Receipts</text></g>
  </g>

  <g transform="translate(940 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="520" height="330" rx="26" fill="#172033"/>
    <rect x="18" y="18" width="484" height="294" rx="14" fill="url(#screen)"/>
    <rect x="48" y="52" width="150" height="24" rx="8" fill="#fff" opacity="0.96"/>
    <rect x="48" y="94" width="96" height="82" rx="16" fill="#fff" opacity="0.96"/>
    <rect x="158" y="94" width="96" height="82" rx="16" fill="#fff" opacity="0.96"/>
    <rect x="268" y="94" width="96" height="82" rx="16" fill="#fff" opacity="0.96"/>
    <rect x="378" y="94" width="76" height="82" rx="16" fill="#fff" opacity="0.96"/>
    <rect x="48" y="198" width="406" height="78" rx="16" fill="#fff" opacity="0.96"/>
    <path d="M88 245l50-18 42 10 55-31 48 16 72-48 58 19" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-42 330h604l-42 40H0z" fill="#cbd5e1"/>
    <rect x="208" y="338" width="108" height="8" rx="4" fill="#64748b" opacity="0.55"/>
  </g>

  <g transform="translate(875 72) rotate(-7)" filter="url(#soft)">
    <rect width="185" height="115" rx="18" fill="#fff"/>
    <text x="20" y="35" fill="#16a34a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">INVOICE</text>
    <rect x="20" y="52" width="142" height="7" rx="4" fill="#e2e8f0"/><rect x="20" y="68" width="108" height="7" rx="4" fill="#e2e8f0"/>
    <text x="163" y="98" text-anchor="end" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="900">R 4,250.00</text>
  </g>

  <g transform="translate(1300 400) rotate(8)" filter="url(#soft)">
    <rect width="190" height="112" rx="18" fill="#fff"/>
    <text x="20" y="34" fill="#7c3aed" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">RECEIPT</text>
    <rect x="20" y="51" width="145" height="7" rx="4" fill="#e2e8f0"/><rect x="20" y="67" width="100" height="7" rx="4" fill="#e2e8f0"/>
    <text x="165" y="95" text-anchor="end" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="900">R 1,250.00</text>
  </g>
</svg>
